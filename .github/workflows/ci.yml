name: Nortis CI

on:
  pull_request:
    branches:
      - feature/supabase-base
  push:
    branches:
      - feature/supabase-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build
