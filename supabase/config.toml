# Configuração base do projeto Supabase (Nortis Concursos).
#
# Este arquivo é um ponto de partida mínimo, criado manualmente nesta fase.
# Ao conectar a um projeto Supabase real, rode `supabase login` e
# `supabase link --project-ref <project-ref>` para sincronizar este arquivo
# com a configuração oficial gerada pela CLI.

project_id = "nortis-concursos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Bucket `products` — confirmado manualmente no Dashboard remoto como
# privado (Public bucket desativado), sem policies em storage.objects
# nem em storage.buckets. Esta declaração só espelha localmente o
# estado já confirmado (public = false); não cria, não altera limites
# de tamanho/MIME e não referencia nenhum arquivo do bucket.
[storage.buckets.products]
public = false

# asaas-webhook: chamada diretamente pelo Asaas, sem JWT do Supabase —
# autentica pelo próprio header `asaas-access-token`.
# create-asaas-checkout: aceita checkout de comprador convidado, sem
# sessão Supabase.
# `verify_jwt = false` só desliga a exigência de JWT do gateway; não
# remove nenhuma validação interna dessas funções.
[functions.asaas-webhook]
verify_jwt = false

[functions.create-asaas-checkout]
verify_jwt = false

# get-download-url: exige comprador autenticado (decisão de arquitetura
# aprovada — checkout sempre com conta). `verify_jwt = true` faz o
# gateway rejeitar qualquer chamada sem JWT válido antes mesmo de
# invocar o código; a função também confirma o usuário internamente via
# auth.getUser(token), sem depender só desta flag.
[functions.get-download-url]
verify_jwt = true
